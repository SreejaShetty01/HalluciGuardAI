{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-brain"></i></div>
            <h4 class="auth-title">Welcome Back</h4>
            <p class="auth-sub">Sign in to your HalluciGuard account</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mb-3">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-ai w-100 justify-content-center mb-3" style="padding:11px;">
                Sign In <i class="fas fa-arrow-right ms-2"></i>
            </button>
            <p class="text-center mb-0" style="font-size:13px;color:var(--text-2);">
                Don't have an account?
                <a href="{% url 'register' %}" style="color:var(--accent);font-weight:600;">Create Account</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
