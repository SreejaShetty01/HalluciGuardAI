<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HalluciGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card" style="position: relative;">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" style="position: absolute; top: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-2); padding: 7px 11px; border-radius: 50%; cursor: pointer; transition: all var(--transition);">
        <i id="themeIcon" class="fas fa-moon"></i>
    </button>
    <div class="auth-logo">
        <div class="auth-logo-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h3 class="auth-title">HalluciGuard Admin</h3>
        <p class="auth-sub">System Administration Panel</p>
    </div>

    {% if messages %}
    <div class="mb-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'danger' %}exclamation-circle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %} me-2"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Admin Username</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
        </div>
        
        <button type="submit" class="btn-ai w-100 mt-2 justify-content-center">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In as Admin
        </button>
    </form>
    
    <div class="text-center mt-4">
        <a href="{% url 'login' %}" style="color: var(--accent); font-size: 13.5px; font-weight: 500;">
            <i class="fas fa-arrow-left me-1"></i> Back to User Portal
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Theme switcher logic
    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('hg_theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (!icon) return;
        if (theme === 'dark') {
            icon.className = 'fas fa-moon';
        } else {
            icon.className = 'fas fa-sun';
        }
    }

    // Initialize Theme on Page Load
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('hg_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    });
</script>
</body>
</html>
